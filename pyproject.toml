[project]
name = "ha-switchbot"
version = "0.1.0"
description = "Enhanced Home Assistant SwitchBot integration with full Meter Pro & Meter Pro CO2 support"
readme = "README.md"
authors = [
    { name = "Mathis Müller", email = "hello@mathismueller.eu" }
]
requires-python = ">=3.11"
dependencies = [
    "pySwitchbot",
]

[tool.uv.sources]
pySwitchbot = { path = "../pySwitchbot", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
