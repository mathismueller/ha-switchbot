meter_pro_set_weather:
  name: "Meter Pro: Set Weather"
  description: "Pushes the weather forecast icon, outdoor temperature and/or humidity to a SwitchBot Meter Pro CO2. The icon shows on the display; temperature and humidity are stored but not shown. Omitted fields keep their current values."
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: switchbot_enhanced
    icon:
      required: false
      selector:
        select:
          options:
            - "sunny"
            - "partly_cloudy"
            - "cloudy"
            - "rainy"
            - "pouring"
            - "heavy_rain"
            - "snowy"
            - "light_snow"
            - "heavy_snow"
            - "none"
    temperature:
      name: "Temperature"
      description: "Outdoor temperature in °C."
      required: false
      selector:
        number:
          min: -127.9
          max: 127.9
          step: 0.1
          unit_of_measurement: "°C"
          mode: box
    humidity:
      name: "Humidity"
      description: "Outdoor relative humidity in %."
      required: false
      selector:
        number:
          min: 1
          max: 99
          step: 1
          unit_of_measurement: "%"
          mode: box

meter_pro_set_external_sensor_mac:
  name: "Meter Pro: Set External Sensor MAC"
  description: "Pairs an external sensor (e.g. SwitchBot Outdoor Meter or emulated ESP32 beacon) to the Meter Pro hardware display."
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: switchbot_enhanced
    mac_address:
      name: "Sensor MAC Address"
      description: "The BLE MAC address of the outdoor sensor (e.g. 'AA:BB:CC:DD:EE:FF', or '00:00:00:00:00:00' to clear)."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    slot:
      name: "Profile Slot"
      description: "The profile slot (1 or 2). Slot 1 is the primary display slot."
      required: false
      default: 1
      selector:
        select:
          options:
            - label: "Slot 1 (Primary)"
              value: "1"
            - label: "Slot 2 (Secondary)"
              value: "2"
    switch_display:
      name: "Switch Display to Outdoor"
      description: "Automatically switch the LCD screen to OUT when pairing, or back to IN when clearing."
      required: false
      default: true
      selector:
        boolean:
