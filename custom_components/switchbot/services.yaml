add_password:
  fields:
    device_id:
      required: true
      example: "c2d01328efd261f586e56d914e3af07e"
      selector:
        device:
          integration: switchbot
    password:
      required: true
      example: "123456"
      selector:
        text:
          type: password

meter_pro_set_weather:
  name: "Meter Pro: Set Weather & Outdoor Display"
  description: "Pushes weather forecast icon and external temperature and humidity to a SwitchBot Meter Pro or Meter Pro CO2."
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: switchbot
    icon:
      required: true
      selector:
        select:
          options:
            - "sunny"
            - "partly_cloudy"
            - "cloudy"
            - "rainy"
            - "heavy_snow"
            - "snowy"
            - "light_snow"
            - "none"
    temperature:
      required: false
      selector:
        number:
          min: -40
          max: 80
          step: 0.1
          unit_of_measurement: "°C"
    humidity:
      required: false
      selector:
        number:
          min: 1
          max: 99
          step: 1
          unit_of_measurement: "%"
