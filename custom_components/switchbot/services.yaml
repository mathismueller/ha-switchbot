add_password:
  fields:
    device_id:
      required: true
      example: "c2d01328efd261f586e56d914e3af07e"
      selector:
        device:
          integration: switchbot
    password:
      required: true
      example: "123456"
      selector:
        text:
          type: password

meter_pro_set_weather:
  name: "Meter Pro: Set Weather Condition Icon"
  description: "Pushes weather forecast icon to a SwitchBot Meter Pro or Meter Pro CO2 display."
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: switchbot
    icon:
      required: true
      selector:
        select:
          options:
            - "sunny"
            - "partly_cloudy"
            - "cloudy"
            - "rainy"
            - "pouring"
            - "heavy_rain"
            - "snowy"
            - "light_snow"
            - "heavy_snow"
            - "none"

meter_pro_set_external_sensor_mac:
  name: "Meter Pro: Set External Sensor MAC"
  description: "Pairs an external sensor (e.g. SwitchBot Outdoor Meter or emulated ESP32 beacon) to the Meter Pro hardware display."
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: switchbot
    mac_address:
      name: "Sensor MAC Address"
      description: "The BLE MAC address of the outdoor sensor (e.g. 'AA:BB:CC:DD:EE:FF', or '00:00:00:00:00:00' to clear)."
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    slot:
      name: "Profile Slot"
      description: "The profile slot (1 or 2). Slot 1 is the primary display slot."
      required: false
      default: 1
      selector:
        select:
          options:
            - label: "Slot 1 (Primary)"
              value: "1"
            - label: "Slot 2 (Secondary)"
              value: "2"
    switch_display:
      name: "Switch Display to Outdoor"
      description: "Automatically switch the LCD screen to OUT when pairing, or back to IN when clearing."
      required: false
      default: true
      selector:
        boolean:
